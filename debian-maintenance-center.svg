<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="70" y1="35" x2="440" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#344F78"/>
      <stop offset=".48" stop-color="#1D3455"/>
      <stop offset="1" stop-color="#101D33"/>
    </linearGradient>
    <linearGradient id="shine" x1="120" y1="50" x2="390" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="175" y1="145" x2="345" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C9D5E4"/>
      <stop offset="1" stop-color="#8295AE"/>
    </linearGradient>
    <linearGradient id="red" x1="215" y1="210" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF777E"/>
      <stop offset="1" stop-color="#D91F3D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Rounded macOS-style app tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="#0B1424" opacity=".35" filter="url(#shadow)"/>
  <rect x="28" y="20" width="456" height="456" rx="104" fill="url(#tile)"/>
  <rect x="30" y="22" width="452" height="452" rx="102" fill="url(#shine)"/>
  <rect x="31.5" y="23.5" width="449" height="449" rx="100" fill="none" stroke="#AFC5E3" stroke-opacity=".38" stroke-width="3"/>
  <path d="M76 91 Q105 42 170 40 H342 Q421 40 455 104" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="8" stroke-linecap="round"/>

  <!-- Gear silhouette -->
  <g filter="url(#shadow)" transform="translate(256 246)">
    <path d="M-25-139 H25 L34-109 Q50-104 64-96 L91-110 L126-75 L111-48 Q119-33 124-17 L153-8 V42 L124 51 Q119 68 110 82 L125 109 L90 144 L63 129 Q48 137 33 142 L25 171 H-25 L-33 142 Q-49 137-64 129 L-91 144 L-126 109 L-111 82 Q-120 67-125 51 L-153 42 V-8 L-124-17 Q-119-33-110-48 L-125-75 L-90-110 L-63-96 Q-49-104-33-109 Z"
          fill="url(#metal)" stroke="#F7FAFF" stroke-opacity=".65" stroke-width="5" stroke-linejoin="round"/>
    <circle r="91" fill="#203650" stroke="#7189A6" stroke-width="8"/>
    <circle r="70" fill="#D8E2EF" stroke="#FFFFFF" stroke-width="5"/>
    <circle r="56" fill="#263F5D"/>
    <!-- Original abstract red Debian-inspired swirl -->
    <path d="M18-35 C-12-54-48-31-43-1 C-39 25-8 42 20 27 C39 17 43-4 29-18
             C17-30-4-27-13-13 C-22 2-10 17 4 15 C14 14 19 4 15-4
             C12-11 3-13-3-8 C-8-3-5 5 1 6"
          fill="none" stroke="url(#red)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="-35" r="7" fill="#FF858B"/>
  </g>

  <!-- Green health indicator -->
  <g transform="translate(365 365)">
    <circle r="49" fill="#0A1729" opacity=".42" filter="url(#smallShadow)"/>
    <circle r="43" fill="#22B875" stroke="#D8FFEA" stroke-width="6"/>
    <path d="M-19 1 L-6 15 L21-16" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- subtle bottom highlight -->
  <path d="M122 432 Q256 466 390 432" fill="none" stroke="#A8C7EA" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>
</svg>
